<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>行程分享 · TransitGo</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fbfdff; --card: #ffffff; --card-walk: #ffffffa0; --text: #0e2038; --muted: #57667e; --line: #e2e8f1;
    --accent: #0a6cf0; --accent-soft: #e6f1ff; --accent2: #0fb88a; --accent2-soft: #e3faf3;
    --red: #d63a3a; --red-soft: #fde4e2; --amber: #b25e00; --amber-soft: #fff7b0;
    --shadow: 0 1px 2px #0e20380a, 0 12px 32px -16px #0e203822;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b1626; --card: #101d33; --card-walk: #101d33a0; --text: #eef3fa; --muted: #9fb0c6; --line: #24344c;
      --accent: #4da3ff; --accent-soft: #0a6cf033; --accent2: #2bd9ac; --accent2-soft: #0fb88a33;
      --red: #ff8a76; --red-soft: #d63a3a33; --amber: #ffcf5c; --amber-soft: #ffe94a26;
      --shadow: 0 1px 2px #00000040, 0 12px 32px -16px #00000066; }
  }
  * { box-sizing: border-box; }
  html, body { background: var(--bg); }
  body { font: 16px/1.55 -apple-system, "PingFang TC", system-ui, sans-serif; color: var(--text); max-width: 560px; margin: 0 auto; padding: 0 16px 48px; -webkit-font-smoothing: antialiased; }
  .brand { display: flex; align-items: center; gap: 9px; padding: 20px 0 6px; text-decoration: none; color: var(--text); font-weight: 800; font-size: 15px; }
  .brand img { width: 26px; height: 26px; display: block; }
  h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.01em; margin: 10px 0 4px; }
  .sub { font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .sub button { font: inherit; font-size: 12px; font-weight: 600; padding: 5px 13px; border-radius: 99px; border: 1px solid var(--line); background: var(--card); color: var(--accent); cursor: pointer; transition: opacity .15s; }
  .sub button:active { opacity: .6; }
  .banner { border-radius: 14px; padding: 11px 14px; font-size: 13px; line-height: 1.5; background: var(--accent-soft); color: var(--text); margin: 12px 0; }
  .banner.warn { background: var(--amber-soft); color: var(--amber); }
  .banner.wake { background: var(--card); border: 1px solid var(--line); color: var(--muted); }
  .leg { background: var(--card); box-shadow: var(--shadow); border: 1px solid var(--line); border-radius: 18px; padding: 16px; margin: 14px 0; }
  .leg.walk { background: var(--card-walk); box-shadow: none; border: 1px dashed var(--line); opacity: .75; padding: 10px 16px; border-radius: 14px; display: flex; align-items: center; gap: 8px; font-size: 14px; }
  .mode { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); margin-right: 6px; letter-spacing: .01em; }
  .mode svg { width: 13px; height: 13px; flex: none; }
  .leg.walk .mode { background: none; padding: 0; color: var(--muted); }
  .route { display: flex; align-items: baseline; gap: 8px; margin-top: 8px; flex-wrap: wrap; font-size: 15px; }
  .name { font-weight: 800; font-size: 16px; }
  .phase { margin-top: 12px; font-size: 19px; font-weight: 800; line-height: 1.3; letter-spacing: -0.01em; }
  .phase.ok { color: var(--accent2); } .phase.late { color: var(--amber); } .phase.bad { color: var(--red); }
  .count { margin-top: 4px; font-size: 14px; color: var(--muted); }
  .count b { font-variant-numeric: tabular-nums; font-size: 17px; color: var(--text); font-weight: 700; }
  .pos { margin-top: 10px; padding: 10px 12px; border-radius: 12px; background: var(--accent-soft); border-left: 3px solid var(--accent); font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 7px; }
  .pos svg { width: 15px; height: 15px; flex: none; color: var(--accent); }
  .badges { margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
  .badge { font-size: 12px; font-weight: 600; padding: 4px 11px; border-radius: 99px; background: var(--line); color: var(--muted); }
  .badge.ok { background: var(--accent2-soft); color: var(--accent2); } .badge.late { background: var(--amber-soft); color: var(--amber); }
  ol.stops { list-style: none; margin: 14px 0 0; padding: 0; position: relative; }
  ol.stops li { position: relative; padding: 4px 0 4px 26px; font-size: 14px; display: flex; justify-content: space-between; gap: 8px; }
  ol.stops li::before { content: ""; position: absolute; left: 7px; top: 0; bottom: 0; width: 2px; background: var(--line); }
  ol.stops li:first-child::before { top: 10px; } ol.stops li:last-child::before { bottom: calc(100% - 10px); }
  ol.stops li::after { content: ""; position: absolute; left: 3px; top: 10px; width: 10px; height: 10px; border-radius: 50%; background: var(--line); border: 2px solid var(--card); }
  ol.stops li.passed { color: var(--muted); } ol.stops li.passed::after { background: var(--accent2); }
  ol.stops li.next { font-weight: 700; } ol.stops li.next::after { background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  ol.stops li.edge { font-weight: 600; }
  ol.stops li .t { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 13px; }
  .note { font-size: 12px; color: var(--muted); margin-top: 8px; line-height: 1.5; }
  .alert { font-size: 13px; color: var(--red); margin-top: 8px; font-weight: 600; display: flex; align-items: flex-start; gap: 6px; }
  .alert svg { width: 14px; height: 14px; flex: none; margin-top: 2px; }
  .rate { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); text-align: center; }
  .rate .stars button { font-size: 30px; background: none; border: 0; cursor: pointer; padding: 2px 4px; color: var(--line); transition: transform .1s, color .1s; }
  .rate .stars button.on { color: #ffb400; }
  .rate .stars button:active { transform: scale(1.15); }
  .rate p { margin: 6px 0; font-size: 14px; color: var(--muted); }
  #err { text-align: center; padding: 60px 16px; font-size: 15px; color: var(--muted); }
  footer { font-size: 12px; color: var(--muted); margin-top: 28px; text-align: center; }
  footer a { color: var(--accent); }
  /* ---- 分享行程（App 內導航：開車/騎機車/走路）---- */
  .nav-dest { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 15px; }
  .nav-dest svg { width: 15px; height: 15px; color: var(--muted); flex: none; }
  .nav-eta { margin-top: 14px; font-size: 30px; font-weight: 800; letter-spacing: -0.02em; }
  .nav-eta small { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-top: 3px; letter-spacing: 0; }
  .nav-bar { margin-top: 14px; height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .nav-bar > div { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 99px; transition: width 1s linear; }
  .nav-instruction { margin-top: 12px; padding: 10px 12px; border-radius: 12px; background: var(--accent-soft); font-size: 14px; font-weight: 600; }
  .nav-arrived { color: var(--accent2); }
  /* ---- 安全分享（選用）：分享者自己選擇要傳送即時位置 ---- */
  .banner.live { background: var(--accent2-soft); color: var(--accent2); font-weight: 600; }
  .live-map { margin: 14px 0; border-radius: 18px; overflow: hidden; border: 1px solid var(--line); box-shadow: var(--shadow); }
  .live-map iframe { display: block; width: 100%; height: 260px; border: 0; }
  .live-map .foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 14px; background: var(--card); font-size: 13px; color: var(--muted); }
  .live-map .foot a { color: var(--accent); font-weight: 600; text-decoration: none; }
</style>
</head>
<body>
<a class="brand" href="https://yayalin.com/app"><img src="https://yayalin.com/app-assets/logo-icon.png" alt="" /><span>交通即時查 TransitGo</span></a>
<h1 id="title">行程分享</h1>
<div class="sub"><span id="sub">讀取中…</span><button id="refresh" type="button" hidden>重新整理</button></div>
<div id="wake" class="banner wake" hidden></div>
<div id="stale" class="banner warn" hidden></div>
<div class="banner" id="disclaimer">這裡顯示的是<b>班次狀態與列車最後回報的位置</b>（台鐵才有），<b>不是 GPS 即時定位</b>，也不含分享者本人的位置。</div>
<div id="liveLocBanner" class="banner live" hidden>分享者已選擇在這個連結<b>額外分享自己的即時位置</b>，任何拿到這個連結的人都能看到。</div>
<div id="liveLoc" class="live-map" hidden></div>
<div id="legs"></div>
<div id="err" hidden></div>
<footer>資料來源：交通部 TDX。連結到期後自動失效。 · <a href="https://yayalin.com/app">交通即時查 TransitGo</a></footer>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
// Everything below is text from a database or a public API: escape it before it goes into the page.
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const token = location.pathname.split("/").filter(Boolean).pop();
// Opened on this server: /s/<token> talks to /v1/... . Opened through yayalin.com (a proxy in front of this server):
// /app/s/<token> talks to /app/api/... , which the proxy forwards to the same /v1/... routes.
const API = location.pathname.startsWith("/app/s/") ? "/app/api" : "/v1";
// Small line icons (not emoji) matching the App/website's own hand-drawn icon style, just simple
// enough to read at 13px. `currentColor` picks up .mode's text color automatically.
const ICONS = {
  bus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M3 11h18"/><path d="M7 17v2M17 17v2"/></svg>',
  metro: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="14" rx="4"/><path d="M4 11h16"/><path d="M9 21l-2-4M15 21l2-4"/><circle cx="9" cy="14" r="0.5" fill="currentColor"/><circle cx="15" cy="14" r="0.5" fill="currentColor"/></svg>',
  train: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="13" rx="3"/><path d="M4 11h16"/><path d="M9 20l-2 2M15 20l2 2"/><circle cx="8" cy="14" r="0.5" fill="currentColor"/><circle cx="16" cy="14" r="0.5" fill="currentColor"/></svg>',
  hsr: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17c0-7 2-12 7-12s7 5 7 12"/><path d="M5 17h14"/><path d="M8 21l-1.5 2M16 21l1.5 2"/></svg>',
  walk: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="4" r="1.6" fill="currentColor" stroke="none"/><path d="M10 22l1.5-6-2-2 1-5 3 1 2 3 3 1M11 16l4 1 2 5"/></svg>',
  bike: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="17" r="3"/><circle cx="18" cy="17" r="3"/><path d="M6 17l4-8h5l3 8M10 9h3M14 9l3 4"/></svg>',
  pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6-5.7-6-10.5a6 6 0 0 1 12 0c0 4.8-6 10.5-6 10.5z"/><circle cx="12" cy="10.5" r="2.2"/></svg>',
  warn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5l9.5 16.5H2.5z"/><path d="M12 10v4"/><circle cx="12" cy="17" r="0.6" fill="currentColor" stroke="none"/></svg>',
  car: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16l1.5-5.5A2 2 0 0 1 7.4 9h9.2a2 2 0 0 1 1.9 1.5L20 16"/><rect x="3" y="16" width="18" height="4" rx="1.5"/><circle cx="7.5" cy="20" r="1.3"/><circle cx="16.5" cy="20" r="1.3"/></svg>',
  scooter: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.5" cy="18" r="2.3"/><circle cx="18" cy="18" r="2.3"/><path d="M5.5 18h5l3-9h3M13.5 9h3M9 12h4l1.5 4"/></svg>',
  flag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 21V4"/><path d="M6 4h12l-3 4 3 4H6"/></svg>',
};
const MODE = { BUS: [ICONS.bus, "公車"], MRT: [ICONS.metro, "捷運"], TRA: [ICONS.train, "台鐵"], HSR: [ICONS.hsr, "高鐵"], WALK: [ICONS.walk, "步行"], BIKE: [ICONS.bike, "YouBike"] };
const NAV_MODE = { automobile: [ICONS.car, "開車"], scooter: [ICONS.scooter, "騎機車"], walking: [ICONS.walk, "步行"] };
const clock = (ms) => ms ? new Date(ms).toLocaleTimeString("zh-TW", { hour: "2-digit", minute: "2-digit", hour12: false, timeZone: "Asia/Taipei" }) : "—";
const isVehicle = (s) => s.mode !== "WALK" && s.mode !== "BIKE";
const reasonText = { not_supported: "這個交通工具沒有公開的即時資料來源，只能顯示班次時間", no_data: "目前查不到這班車的即時資料", unavailable: "即時資料暫時取不到", rate_limited: "即時資料查詢太頻繁，稍後會自動再試" };

let plan = null, live = null, lastOkAt = 0, polling = false;

/* ---------- robust fetching: a sleeping server, a challenge page or a dropped connection are retried, not fatal ---------- */
async function tryFetch(url, opts) {
  try {
    const r = await fetch(url, { cache: "no-store", ...opts });
    const text = await r.text();
    let body = null; try { body = JSON.parse(text); } catch { /* an HTML page from the host while it wakes up */ }
    return { status: r.status, body };
  } catch { return { status: 0, body: null }; }
}
/** Retries with growing pauses until `deadlineMs` has passed; calls onWait(attempt) while it waits.
 *  404 is final — except in the first `notFoundGraceMs`: the app hands out a link before its details have finished
 *  uploading, so a brand-new link can be "not found" for a few seconds. */
async function fetchWithRetry(url, { deadlineMs = 150000, notFoundGraceMs = 25000, onWait } = {}) {
  const start = Date.now();
  for (let attempt = 1; ; attempt++) {
    const r = await tryFetch(url);
    if (r.status === 200 && r.body) return r;
    if (r.status === 404 && Date.now() - start > notFoundGraceMs) return r;
    if (Date.now() - start > deadlineMs) return r;
    onWait?.(attempt, Date.now() - start, r.status === 404);
    await new Promise((res) => setTimeout(res, Math.min(8000, 1000 + attempt * 1000)));
  }
}
function waking(on, attempt, elapsed, notFound) {
  const el = $("wake");
  el.hidden = !on;
  if (on && notFound) { el.textContent = "連結內容還在建立中…（分享的人剛送出，通常幾秒內就好，會自動重試）"; return; }
  if (on) el.textContent = `伺服器正在喚醒中…（第 ${attempt} 次嘗試，已等 ${Math.round(elapsed / 1000)} 秒；第一次通常要 30～60 秒，會自動重試，不用重新整理）`;
}

/* ---------- rendering ---------- */
function legShell(seg, i) {
  const [icon, label] = MODE[seg.mode] || ["", seg.mode];
  if (!isVehicle(seg)) {
    return `<div class="leg walk" id="leg-${i}"><span class="mode">${icon} ${esc(label)}</span>${esc(seg.fromName || "")} → ${esc(seg.toName || "")}</div>`;
  }
  return `<div class="leg" id="leg-${i}">
    <div><span class="mode">${icon} ${esc(label)}</span></div>
    <div class="route"><span class="name">${esc(seg.line || seg.routeShortName || "")}</span><span>${esc(seg.fromName || "?")} → ${esc(seg.toName || "?")}</span></div>
    <div id="body-${i}"><div class="note">查詢即時狀態中…</div></div>
  </div>`;
}

/** What the family cares about, in order: where is it, how long until it leaves / arrives, how many stops. */
function legModel(seg, train, ov) {
  const sched = { dep: Date.parse(seg.departureTime), arr: Date.parse(seg.arrivalTime) };
  const m = { phase: "", tone: "", pos: "", dep: sched.dep, arr: sched.arr, depEst: false, arrEst: false, delay: null, stops: [], stopsLeft: null, arrived: false, note: "", alerts: [] };
  const now = Date.now();
  if (train && train.available) {
    if (train.depMs) { m.dep = train.depMs; m.depEst = train.depIsEstimate; }
    if (train.arrMs) { m.arr = train.arrMs; m.arrEst = train.arrIsEstimate; }
    m.delay = Number.isFinite(train.delayMinutes) ? train.delayMinutes : null;
    m.stops = train.stops || [];
    m.stopsLeft = train.stopsToTo;
    const p = train.position;
    if (p) {
      const where = p.status === "departed" ? `已離開 ${p.stationName}` : p.status === "at_station" ? `停靠 ${p.stationName}` : p.status === "approaching" ? `進站中：${p.stationName}` : `在 ${p.stationName}`;
      m.pos = `${where}` + (train.next ? ` · 下一站 ${train.next.name}${train.next.estMs ? `（約 ${clock(train.next.estMs)}）` : ""}` : "");
    }
    switch (train.phase) {
      case "notStarted": m.phase = "尚未發車"; break;
      case "beforeBoarding": m.phase = "列車行駛中，還沒到上車的站"; m.tone = ""; break;
      case "running": m.phase = "行駛中"; break;
      case "arrived": m.phase = `已到達 ${seg.toName || "目的地"}`; m.tone = "ok"; m.arrived = true; break;
      case "ended": m.phase = "這班車已結束行程"; m.arrived = now >= sched.arr; break;
      case "noLiveData": m.phase = "目前沒有這班車的位置資料"; m.note = "可能還沒發車，或這班車暫時不在即時資料裡；下面顯示的是班表時間。"; break;
      default: m.phase = "狀態不明";
    }
    if (train.liveStale && train.liveAgeSeconds != null) m.note = `位置是 ${train.liveAgeSeconds} 秒前的資料（最新一次更新暫時失敗，會自動重試）。` + (m.note ? " " + m.note : "");
    if (!train.liveAvailable && train.reasons?.live) m.note = (m.note ? m.note + " " : "") + (train.scheduleSource === "general" ? "這是未來日期的一般班表，沒有即時位置。" : (reasonText[train.reasons.live] || ""));
    if (m.delay != null && m.delay > 0 && !m.arrived) { m.tone = "late"; }
    else if (m.delay === 0 && train.position && !m.arrived) { m.tone = "ok"; }
  } else if (train) {
    m.phase = "目前查不到這班車的資料"; m.note = reasonText[train.reasons?.timetable] || reasonText[train.reasons?.live] || "";
  } else if (ov) {
    // bus / metro: the ordinary overlay
    const s = ov.status;
    m.alerts = (ov.alerts || []).slice(0, 2);
    if (!ov.available || !s) { m.phase = seg.mode === "HSR" ? "高鐵：只有班次時間" : "目前沒有即時資料"; m.note = reasonText[ov.reason] || ""; }
    else {
      if (s.estimatedTime) { m.dep = Date.parse(s.estimatedTime); m.depEst = true; }
      const mins = Number.isFinite(s.delaySeconds) ? Math.round(s.delaySeconds / 60) : null;
      m.delay = mins;
      m.phase = s.state === "cancelled" ? "這班車已停駛" : s.etaSeconds != null ? `約 ${Math.max(0, Math.round(s.etaSeconds / 60))} 分鐘後到站` : mins > 0 ? "行駛中（誤點）" : "有即時資料";
      m.tone = s.state === "cancelled" ? "bad" : mins > 0 ? "late" : "ok";
    }
  } else {
    m.phase = seg.mode === "HSR" ? "高鐵：只有班次時間" : "查詢即時狀態中…";
    if (seg.mode === "HSR") m.note = reasonText.not_supported;
  }
  return m;
}

function legHtml(seg, i, m) {
  const badges = [];
  if (m.delay != null) badges.push(m.delay > 0 ? `<span class="badge late">誤點 ${m.delay} 分</span>` : `<span class="badge ok">準點</span>`);
  if (m.stopsLeft != null && !m.arrived) badges.push(`<span class="badge">還有 ${m.stopsLeft} 站到 ${esc(seg.toName || "終點")}</span>`);
  const stops = m.stops.length ? `<ol class="stops">${m.stops.map((s) => `<li class="${s.status}${s.isBoarding || s.isAlighting ? " edge" : ""}"><span>${esc(s.name)}${s.isBoarding ? "（上車）" : s.isAlighting ? "（下車）" : ""}${s.status === "next" ? " ←" : ""}</span><span class="t">${clock(s.estMs)}</span></li>`).join("")}</ol>` : "";
  return `
    <div class="phase ${m.tone}">${esc(m.phase)}</div>
    ${m.pos ? `<div class="pos">${ICONS.pin}<span>${esc(m.pos)}</span></div>` : ""}
    <div class="count" data-i="${i}"></div>
    <div class="badges">${badges.join("")}</div>
    ${stops}
    ${m.note ? `<div class="note">${esc(m.note)}</div>` : ""}
    ${m.alerts.map((a) => `<div class="alert">${ICONS.warn}<span>${esc(a.title)}</span></div>`).join("")}
    <div class="note">預定 ${clock(Date.parse(seg.departureTime))} 發車 → ${clock(Date.parse(seg.arrivalTime))} 抵達${m.depEst || m.arrEst ? `；預估 ${clock(m.dep)} 發車 → ${clock(m.arr)} 抵達` : ""}</div>
    ${m.arrived ? rateHtml(seg, i) : ""}`;
}

function rateHtml(seg, i) {
  let done = null; try { done = localStorage.getItem(`rated:${token}:${i}`); } catch { /* private mode */ }
  if (done) return `<div class="rate"><p>謝謝你的評分（${"★".repeat(Number(done) || 0)}）</p></div>`;
  return `<div class="rate" data-rate="${i}"><p>這趟搭乘還好嗎？幫忙評個分（匿名，只算星星）</p><div class="stars">${[1, 2, 3, 4, 5].map((n) => `<button type="button" data-star="${n}" data-leg="${i}" aria-label="${n} 星">★</button>`).join("")}</div><p class="note" id="rate-msg-${i}"></p></div>`;
}

let models = [];
function renderLegs() {
  if (!plan) return;
  models = plan.segments.map((seg, i) => {
    if (!isVehicle(seg)) return null;
    const train = (live?.trains || []).find((t) => t.index === i) || null;
    const ov = (live?.legs || []).find((l) => l.index === i) || null;
    return legModel(seg, train, ov);
  });
  plan.segments.forEach((seg, i) => {
    const el = $("body-" + i); if (!el || !models[i]) return;
    el.innerHTML = legHtml(seg, i, models[i]);
  });
  tickClock();
}

/* ---------- the per-second countdown: computed on this device, no request ---------- */
function fmtSpan(ms) {
  const s = Math.max(0, Math.round(ms / 1000));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  return h ? `${h} 小時 ${m} 分` : m ? `${m} 分 ${String(sec).padStart(2, "0")} 秒` : `${sec} 秒`;
}
function fmtMeters(m) { return m >= 1000 ? `${(m / 1000).toFixed(1)} 公里` : `${Math.round(m)} 公尺`; }

/* ---------- 分享行程（App 內導航）：只有距離/時間/下一個指示，從來沒有座標 ---------- */
let navFurthestMeters = 0;   // "剩多少" 的分母：這趟看過最遠的剩餘距離，用來畫進度條
function navShell() {
  const [icon, label] = NAV_MODE[plan.nav.mode] || [ICONS.car, plan.nav.mode];
  return `<div class="leg" id="nav-leg">
    <div><span class="mode">${icon} ${esc(label)}</span></div>
    <div class="nav-dest">${ICONS.flag}<span>前往 <b>${esc(plan.nav.destinationName)}</b></span></div>
    <div id="nav-body"><div class="note">等待分享者的第一次更新中…</div></div>
  </div>`;
}
function renderNav() {
  const el = $("nav-body");
  if (!el) return;
  const n = live?.nav;
  if (!n) {
    el.innerHTML = `<div class="note">${live === null ? "等待分享者的第一次更新中…" : "分享者目前沒有在導航中（App 沒有在前景，或已經結束這趟行程）——這不代表已經到達，只是暫時看不到最新進度。"}</div>`;
    return;
  }
  navFurthestMeters = Math.max(navFurthestMeters, n.remainingMeters);
  const pct = n.arrived ? 100 : navFurthestMeters > 0 ? Math.max(2, Math.min(100, Math.round((1 - n.remainingMeters / navFurthestMeters) * 100))) : 0;
  el.innerHTML = `
    ${n.arrived
      ? `<div class="phase nav-arrived">已經到達</div>`
      : `<div class="nav-eta" data-eta="${n.etaSeconds}" data-at="${Date.parse(n.updatedAt)}">約 <span class="nav-eta-val">${fmtSpan(n.etaSeconds * 1000)}</span> 後到達<small>剩餘 ${fmtMeters(n.remainingMeters)}</small></div>`}
    <div class="nav-bar"><div style="width:${pct}%"></div></div>
    ${n.instruction ? `<div class="nav-instruction">${esc(n.instruction)}</div>` : ""}`;
}
function tickNav() {
  const el = document.querySelector(".nav-eta");
  if (!el) return;
  const baseSeconds = Number(el.dataset.eta), at = Number(el.dataset.at);
  const elapsedSeconds = (Date.now() - at) / 1000;
  const left = Math.max(0, baseSeconds - elapsedSeconds);
  const valEl = el.querySelector(".nav-eta-val");
  if (valEl) valEl.textContent = fmtSpan(left * 1000);
}
function tickClock() {
  const now = Date.now();
  if (plan?.kind === "nav") tickNav();
  else document.querySelectorAll(".count").forEach((el) => {
    const i = Number(el.dataset.i), m = models[i], seg = plan?.segments[i];
    if (!m || !seg) return;
    let html = "";
    if (m.arrived) html = `已於 ${clock(m.arr)} 前後到達`;
    else if (now < m.dep) html = `距離發車 <b>${fmtSpan(m.dep - now)}</b>${m.depEst ? "（預估）" : ""}`;
    else if (now < m.arr) html = `約 <b>${fmtSpan(m.arr - now)}</b> 後到達 ${esc(seg.toName || "")}，預計 ${clock(m.arr)}${m.arrEst ? "（預估）" : ""}`;
    else html = `已過預定到達時間（${clock(m.arr)}）`;
    if (el.innerHTML !== html) el.innerHTML = html;
  });
  const age = lastOkAt ? Math.round((now - lastOkAt) / 1000) : null;
  if (age != null) {
    const every = plan?.kind === "nav" ? 8 : 15;
    $("sub").textContent = `資料 ${age} 秒前更新（每 ${every} 秒自動更新）`;
    const stale = $("stale");
    const staleAfter = plan?.kind === "nav" ? 30 : 60;
    stale.hidden = age < staleAfter;
    if (age >= staleAfter) stale.textContent = `已經 ${age} 秒沒有更新到最新資料（可能是連線或資料來源暫時有問題），下面是最後一次成功的內容，會自動重試。`;
  }
}

/* ---------- loading ---------- */
function gone(msg) {
  $("legs").innerHTML = ""; $("sub").textContent = ""; $("disclaimer").hidden = true; $("wake").hidden = true; $("stale").hidden = true; $("refresh").hidden = true;
  $("err").hidden = false; $("err").textContent = msg;
}
async function loadPlan() {
  const r = await fetchWithRetry(API + "/shares/" + encodeURIComponent(token), { onWait: (a, e, nf) => waking(true, a, e, nf) });
  waking(false);
  if (r.status === 404) return gone("這個分享連結已過期或不存在");
  if (r.status !== 200 || !r.body) return gone("連不上伺服器。請稍後再重新整理這一頁（伺服器休眠或維護中）。");
  plan = r.body;
  $("title").textContent = plan.title || "行程分享";
  document.title = (plan.title || "行程分享") + " · TransitGo";
  if (plan.kind === "nav") {
    $("disclaimer").innerHTML = `這裡顯示的是分享者導航的<b>剩餘距離與預估時間</b>，<b>不是 GPS 即時定位</b>，不含分享者本人的座標位置。`;
    $("legs").innerHTML = navShell();
  } else {
    $("legs").innerHTML = plan.segments.map(legShell).join("");
  }
  $("liveLocBanner").hidden = !plan.liveLocationEnabled;
  $("refresh").hidden = false;
  await refreshLive(true);
  setInterval(tickClock, 1000);
  setInterval(() => refreshLive(false), plan.kind === "nav" ? 8000 : 15000);
}
async function refreshLive(force) {
  if (!plan || polling || (document.hidden && !force)) return;
  polling = true;
  try {
    const r = await tryFetch(API + "/shares/" + encodeURIComponent(token) + "/live");
    if (r.status === 404) return gone("這個分享連結已過期");
    if (r.status === 200 && r.body) { live = r.body; lastOkAt = Date.now(); }
    if (plan.kind === "nav") renderNav();
    else if (r.status === 200 && r.body) renderLegs();
    else if (!live) renderLegs();   // first attempt failed: show the schedule at least; the next tick retries
    renderLiveLocation();
  } finally { polling = false; }
}

/* ---------- 安全分享（選用）：分享者自己選擇要不要傳送即時座標，預設是不傳 ---------- */
let lastLiveLocAt = null;
function renderLiveLocation() {
  const box = $("liveLoc");
  const loc = plan?.liveLocationEnabled ? live?.liveLocation : null;
  if (!loc) { box.hidden = true; return; }
  // Rebuild the iframe only when the coordinate actually moved — reloading it every poll would
  // restart the embed and could flicker/reset the user's zoom.
  if (lastLiveLocAt === loc.updatedAt) { box.hidden = false; return; }
  lastLiveLocAt = loc.updatedAt;
  const d = 0.004;   // ~a few hundred metres of context around the pin
  const bbox = [loc.lon - d, loc.lat - d, loc.lon + d, loc.lat + d].join("%2C");
  const src = `https://www.openstreetmap.org/export/embed.html?bbox=${bbox}&layer=mapnik&marker=${loc.lat}%2C${loc.lon}`;
  const appleUrl = `https://maps.apple.com/?ll=${loc.lat},${loc.lon}&q=分享者位置`;
  box.innerHTML = `<iframe src="${src}" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    <div class="foot"><span>位置更新於 ${clock(Date.parse(loc.updatedAt))}</span><a href="${appleUrl}" target="_blank" rel="noopener">在地圖 App 開啟</a></div>`;
  box.hidden = false;
}
$("refresh").addEventListener("click", () => refreshLive(true));
document.addEventListener("visibilitychange", () => refreshLive(false));

/* ---------- rating ---------- */
document.addEventListener("click", async (e) => {
  const b = e.target.closest("button[data-star]"); if (!b) return;
  const leg = Number(b.dataset.leg), stars = Number(b.dataset.star);
  const msg = $("rate-msg-" + leg);
  document.querySelectorAll(`button[data-leg="${leg}"]`).forEach((x) => x.classList.toggle("on", Number(x.dataset.star) <= stars));
  msg.textContent = "送出中…";
  const r = await tryFetch(`${API}/shares/${encodeURIComponent(token)}/rating`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ stars, legIndex: leg }) });
  if (r.status === 200) { try { localStorage.setItem(`rated:${token}:${leg}`, String(stars)); } catch { /* private mode */ } renderLegs(); }
  else if (r.status === 409) msg.textContent = r.body?.error === "already rated" ? "你已經評過分了，謝謝！" : "這班車還沒到達，到達後才能評分。";
  else msg.textContent = "送出失敗，請稍後再試。";
});

loadPlan();
</script>
</body>
</html>
