services:
  - type: web
    name: transitgo-server
    runtime: node
    plan: free
    rootDir: transitgo-server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /v1/health
    envVars:
      - key: ADMIN_TOKEN
        sync: false
      - key: TDX_CLIENT_ID
        sync: false
      - key: TDX_CLIENT_SECRET
        sync: false
      # Routing graph artifact storage (Supabase Storage, S3-compatible) — see
      # transitgo-server/.env.example for where to get these. Leave unset and the graph
      # simply stays empty after a restart/redeploy until POST /v1/admin/routing/rebuild
      # is called again (the old /tmp-only behavior); the server never crashes either way.
      - key: SUPABASE_S3_ENDPOINT
        sync: false
      - key: SUPABASE_S3_REGION
        sync: false
      - key: SUPABASE_S3_ACCESS_KEY_ID
        sync: false
      - key: SUPABASE_S3_SECRET_ACCESS_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        sync: false
      - key: BIKE_CITIES
        value: Taipei,NewTaipei,Taoyuan,Hsinchu,HsinchuCounty,MiaoliCounty,Taichung,ChanghuaCounty,Chiayi,ChiayiCounty,Tainan,Kaohsiung,PingtungCounty,YilanCounty,HualienCounty,TaitungCounty,KinmenCounty
      - key: BIKE_POLL_MINUTES
        value: "2"
      - key: ALERT_POLL_MINUTES
        value: "3"
      - key: ANNOUNCE_RECOVERY
        value: "true"
      # APNs push stays DRY_RUN (logged, not sent) unless you also set
      # APNS_KEY_PATH won't work here (no persistent disk) — leave push unconfigured
      # for now, or switch push.mjs to read a PEM from an env var like the Firebase
      # port's APNS_KEY_CONTENT if you want real push on Render.
